<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requirements Analysis Workbench</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, sans-serif;
      --bg: #f3f6f8;
      --card: #fff;
      --ink: #152132;
      --muted: #5d6878;
      --line: #cbd4dd;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { max-width: 860px; margin: auto; padding: 18px; }
    h1 { margin: 0 0 5px; font-size: 1.6rem; }
    p { margin: 0; color: var(--muted); line-height: 1.4; }
    fieldset {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--card);
    }
    legend { padding: 0 5px; font-weight: 700; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    label {
      display: flex;
      gap: 7px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 650;
      cursor: pointer;
    }
    label:hover { border-color: var(--accent); }
    input { accent-color: var(--accent); }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    #summary, #status { font-size: .86rem; }
    #status { min-height: 1.4em; margin-top: 9px; color: var(--accent); }
    button {
      min-height: 40px;
      padding: 8px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    @media (max-width: 650px) {
      main { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      .bar { align-items: stretch; flex-direction: column; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1520;
        --card: #17202c;
        --ink: #e9eef5;
        --muted: #a8b2c1;
        --line: #3a4656;
        --accent: #2dd4bf;
      }
      button { color: #062d29; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Requirements Analysis Workbench</h1>
    <p>Analysis stays paused until you apply a mode and at least one output.</p>
    <form id="form">
      <fieldset>
        <legend>1. Review mode</legend>
        <div class="grid">
          <label><input type="radio" name="mode" value="guided" checked>Guided</label>
          <label><input type="radio" name="mode" value="standard">Standard</label>
          <label><input type="radio" name="mode" value="professional">Professional</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>2. Output modules</legend>
        <div class="grid">
          <label><input type="checkbox" name="modules" value="problem-vision-scope" checked>Problem, vision &amp; scope</label>
          <label><input type="checkbox" name="modules" value="requirements" checked>Requirements</label>
          <label><input type="checkbox" name="modules" value="fishbone" checked>Fishbone</label>
          <label><input type="checkbox" name="modules" value="context" checked>Context</label>
          <label><input type="checkbox" name="modules" value="domain-model" checked>Domain model</label>
          <label><input type="checkbox" name="modules" value="use-cases" checked>Use cases</label>
          <label><input type="checkbox" name="modules" value="activity" checked>Activity</label>
          <label><input type="checkbox" name="modules" value="wireframe" checked>Wireframe</label>
          <label><input type="checkbox" name="modules" value="feasibility" checked>Feasibility</label>
          <label><input type="checkbox" name="modules" value="data-io" checked>Data I/O</label>
          <label><input type="checkbox" name="modules" value="lifecycle-roadmap" checked>Lifecycle &amp; roadmap</label>
        </div>
        <div class="bar">
          <span id="summary">Guided | 11 modules | TraceGuard on</span>
          <button id="apply" type="submit">Apply selection</button>
        </div>
        <div id="status" role="status" aria-live="polite">Waiting for your selection.</div>
      </fieldset>
    </form>
  </main>

  <script>
    const form = document.querySelector("#form");
    const summary = document.querySelector("#summary");
    const status = document.querySelector("#status");
    const apply = document.querySelector("#apply");
    const pending = new Map();
    let nextId = 1;
    let appReady;

    function selection() {
      const modules = [...form.querySelectorAll('input[name="modules"]:checked')]
        .map((input) => input.value);
      return { mode: form.elements.mode.value, modules, traceguard: true };
    }

    function refresh() {
      const value = selection();
      const mode = value.mode[0].toUpperCase() + value.mode.slice(1);
      summary.textContent = `${mode} | ${value.modules.length} modules | TraceGuard on`;
    }

    // Send a request through the standard MCP Apps postMessage bridge.
    function request(method, params) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        setTimeout(() => {
          if (!pending.has(id)) return;
          pending.delete(id);
          reject(new Error(`${method} timed out`));
        }, 8000);
      });
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (event.source !== window.parent || !pending.has(message?.id)) return;
      const item = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) item.reject(new Error(message.error.message));
      else item.resolve(message.result);
    });

    function notify(method, params = {}) {
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }

    async function connect() {
      await request("ui/initialize", {
        appInfo: { name: "Requirements Analysis Workbench", version: "0.4.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26"
      });
      notify("ui/notifications/initialized");
      notify("ui/notifications/size-changed", {
        height: document.documentElement.scrollHeight
      });
      return true;
    }

    async function callTool(value) {
      if (window.openai?.callTool) {
        return window.openai.callTool("save_workbench_selection", value);
      }
      if (!await appReady) {
        throw new Error("Codex tool bridge is unavailable");
      }
      return request("tools/call", {
        name: "save_workbench_selection",
        arguments: value
      });
    }

    async function continueTurn(value) {
      const text = `Workbench confirmed. Mode: ${value.mode}. Modules: ${value.modules.join(", ")}. TraceGuard: enabled. Begin analysis using exactly this selection.`;
      if (window.openai?.sendFollowUpMessage) {
        return window.openai.sendFollowUpMessage({ prompt: text });
      }
      if (!await appReady) {
        throw new Error("Codex follow-up bridge is unavailable");
      }
      return request("ui/message", {
        role: "user",
        content: [{ type: "text", text }]
      });
    }

    form.addEventListener("change", refresh);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = selection();
      if (!value.modules.length) {
        status.textContent = "Select at least one output module.";
        return;
      }
      apply.disabled = true;
      status.textContent = "Applying selection...";
      try {
        const result = await callTool(value);
        const structured = result?.structuredContent || result?.result?.structuredContent;
        if (!structured?.confirmed) {
          throw new Error("Server confirmation was missing");
        }
        await continueTurn(value);
        status.textContent = "Confirmed. Analysis can now start.";
      } catch (error) {
        status.textContent = `Unable to apply: ${error.message}`;
        apply.disabled = false;
      }
    });

    refresh();
    appReady = connect().catch(() => false);
  </script>
</body>
</html>
